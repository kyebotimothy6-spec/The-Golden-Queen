
<!DOCTYPE html>
<html>
<head>
    <title>The Golden Queen</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* HEADER */
        header {
            background-color: #8b0000;
            color: white;
            padding: 20px;
            box-shadow: 0 4px 8px gray;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .logo {
            font-size: 30px;
        }

        /* NAVIGATION */
        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            padding: 10px;
        }

        nav a:hover {
            background-color: gold;
            color: black;
            border-radius: 5px;
        }

        /* MENU */
        h2 {
            text-align: center;
            color: darkred;
        }

        .menu-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .food-card {
            width: 250px;
            height: 350px;
            padding: 15px;
            text-align: center;
            border-radius: 15px;
            background: linear-gradient(to right, orange, gold);
            box-shadow: 0 4px 8px gray;
        }

        .food-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .food-card h3 {
            color: darkred;
        }

        /* ORDER FORM */
        .order-form {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 8px;
        }

        .gender input,
        .drinks input {
            width: auto;
        }

        .gender label,
        .drinks label {
            display: inline-block;
            margin-right: 15px;
        }

        button {
            background-color: darkred;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: orange;
            color: black;
        }

        /* FOOTER */
        footer {
            background-color: #8b0000;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>The Golden Queen</h1>
        <div class="logo">🍽️</div>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#order">Order</a>
    </nav>

    <!-- MENU -->
    <section id="menu">
        <h2>Our Menu</h2>

        <div class="menu-container">

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
                     alt="Pizza">
                <h3>Pizza</h3>
                <p>Delicious cheese pizza</p>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
                     alt="Burger">
                <h3>Burger</h3>
                <p>Fresh and tasty burger</p>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
                     alt="Salad">
                <h3>Salad</h3>
                <p>Fresh healthy salad</p>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd"
                     alt="Healthy food">
                <h3>Healthy Meal</h3>
                <p>Nutritious and delicious</p>
            </div>

        </div>
    </section>

    <!-- ORDER FORM -->
    <section id="order">
        <h2>Order Form</h2>

        <form class="order-form">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   maxlength="50" required>

            <label>Gender:</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <label for="food">Choose Food:</label>

            <select id="food" name="food" required>
                <option value="">Select food</option>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Salad</option>
                <option>Healthy Meal</option>
            </select>

            <label for="table">Table Number:</label>

            <select id="table" name="table" required>
                <option value="">Select table</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
            </select>

            <label>Drinks:</label>

            <div class="drinks">
                <label>
                    <input type="checkbox" name="drink" value="Wine">
                    Wine
                </label>

                <label>
                    <input type="checkbox" name="drink" value="Beer">
                    Beer
                </label>

                <label>
                    <input type="checkbox" name="drink" value="Soda">
                    Soda
                </label>

                <label>
                    <input type="checkbox" name="drink" value="Water">
                    Water
                </label>
            </div>

            <button type="submit">Submit Order</button>

        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>Developed by:KyeboTimothy</p>
        <p>&copy; 2026 The Golden Queen Restaurant</p>
    </footer>

</body>
</html>
